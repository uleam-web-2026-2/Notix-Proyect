services:
  postgres:
    image: postgres:17-alpine
    container_name: notix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-notix}
      POSTGRES_USER: ${DB_USER:-notix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-notix_dev_password}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - notix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-notix} -d ${DB_NAME:-notix}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  notix-postgres-data:
